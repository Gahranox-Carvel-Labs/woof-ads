<!-- Ad Script 1 format if fullWidthResponsive is true, otherwise Ad Script 2 format -->
@if (fullWidthResponsive) {
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-7129718359200150"
       [attr.data-ad-slot]="adSlot"
       [attr.data-ad-format]="adFormat"
       data-full-width-responsive="true"></ins>
} @else {
  <ins class="adsbygoogle"
       style="display:block"
       [attr.data-ad-format]="adFormat"
       data-ad-client="ca-pub-7129718359200150"
       [attr.data-ad-slot]="adSlot"></ins>
}
